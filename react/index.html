<!doctype html>
<!--LINGUAGEM-->
<html lang="pt-br">
  <head>
    <meta
      name="description"
      content="A Melifort oferece soluções em plásticos, policarbonato, acrílico e PVC para indústrias, comércios e residências. Conheça nossos produtos."
    />

    <!-- PRECARREGA A PRIMEIRA IMAGEM DO BANNER -->
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%carroussel-webp/policarbonato.webp"
      fetchpriority="high"
    />

    <!--PERMITE CARACTERES ESPECIAIS E ACENTUAÇÃO-->
    <meta charset="UTF-8" />

    <!--ICONE DA BARRA DO NAVEGADOR-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--DEIXA O SITE RESPONSIVO-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--TITULO DA PAGINA-->
    <title>Melifort | Soluções Industriais</title>
  </head>

  <!--BUSCA OS ELEMENTOS NO APP.JSX ONDE FICA O CÓDIGO-->
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--LEADSTER-->

    <!-- Leadster - Melifort -->
    <script>
      (function () {
        const rotaGestao = "/x7Kp92mQ4vR8";

        // VERIFICA SE ESTÁ NO PAINEL ADMINISTRATIVO
        function estaNaGestao() {
          const rota = window.location.hash
            .slice(1)
            .split("?")[0]
            .toLowerCase();

          const gestao = rotaGestao.toLowerCase();

          return rota === gestao || rota.startsWith(gestao + "/");
        }

        const iniciouNaGestao = estaNaGestao();

        // RECARREGA AO ALTERNAR ENTRE O SITE E O PAINEL
        window.addEventListener("hashchange", function () {
          if (estaNaGestao() !== iniciouNaGestao) {
            window.location.reload();
          }
        });

        // IMPEDE O CARREGAMENTO DO LEADSTER NO PAINEL
        if (iniciouNaGestao) {
          return;
        }

        // CARREGA O LEADSTER NO SITE PUBLICO
        try {
          window.neuroleadId = "FcSaqLCDyPwqTYW6LY8LlDwQn";

          const script = document.createElement("script");

          script.id = "leadster-script";
          script.src = "https://cdn.leadster.com.br/neurolead/neurolead.min.js";

          script.charset = "UTF-8";
          script.defer = true;

          document.head.appendChild(script);
        } catch (erro) {
          console.error("Erro ao carregar Leadster:", erro);
        }
      })();
    </script>
  </body>
</html>
